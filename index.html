<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login 3D Keren</title>
    <link rel="stylesheet" href="anas.css">
</head>

<body>
    <!-- Container utama sebagai panggung perspektif 3D -->
    <div class="container">
        <!-- Kartu login yang akan dianimasikan secara 3D -->
        <div class="card" id="card">
            <h2>Welcome Back To MY Link Bokep</h2>
            <form>
                <div class="input-group">
                    <input type="email" required placeholder="Email">
                </div>
                <div class="input-group">
                    <input type="password" required placeholder="Password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>
    <script src="anas.js"></script>
</body>

</html>
